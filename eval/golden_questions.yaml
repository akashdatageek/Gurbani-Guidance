questions:
  # ─── Core concepts ───────────────────────────────────────────────────────

  - id: q001
    category: core_concept
    question: "What does Gurbani say about haumai (ego)?"
    expected_terms: ["haumai", "ego", "hau", "pride", "self"]
    expected_angs: []
    notes: "Should return passages about ego/haumai — a central theme in Gurbani"

  - id: q002
    category: core_concept
    question: "What is Naam according to SGGS?"
    expected_terms: ["naam", "name", "simran", "divine name"]
    expected_angs: []
    notes: "Naam (the Divine Name) is foundational — should have many passages"

  - id: q003
    category: core_concept
    question: "What does Gurbani teach about hukam (divine order)?"
    expected_terms: ["hukam", "command", "order", "will", "divine order"]
    expected_angs: []
    notes: "Hukam is explored extensively in Japji Sahib and throughout SGGS"

  - id: q004
    category: core_concept
    question: "What does SGGS say about sewa (selfless service)?"
    expected_terms: ["sewa", "seva", "service", "serve", "selfless"]
    expected_angs: []
    notes: "Sewa is a central Sikh practice addressed throughout SGGS"

  - id: q005
    category: core_concept
    question: "What does Gurbani say about sangat (holy congregation)?"
    expected_terms: ["sangat", "congregation", "sadh", "company", "satsang"]
    expected_angs: []
    notes: "The importance of sadh sangat is frequently taught in Gurbani"

  - id: q006
    category: core_concept
    question: "What does SGGS teach about kirtan (devotional music/singing)?"
    expected_terms: ["kirtan", "keertan", "singing", "praise", "music", "gayan"]
    expected_angs: []
    notes: "Kirtan as spiritual practice appears throughout SGGS"

  - id: q007
    category: core_concept
    question: "What is maya according to Gurbani?"
    expected_terms: ["maya", "illusion", "attachment", "worldly", "material"]
    expected_angs: []
    notes: "Maya (worldly illusion/attachment) is a pervasive theme"

  # ─── Life themes ─────────────────────────────────────────────────────────

  - id: q008
    category: life_theme
    question: "How does Gurbani address suffering and pain (dukh)?"
    expected_terms: ["dukh", "suffering", "pain", "sorrow", "dukham"]
    expected_angs: []
    notes: "Dukh and sukh (suffering and joy) are discussed in context of divine will"

  - id: q009
    category: life_theme
    question: "What does Gurbani say about death and the afterlife?"
    expected_terms: ["death", "dying", "maran", "kaal", "marag", "afterlife"]
    expected_angs: []
    notes: "Death as transition, not end — should appear in many shabads"

  - id: q010
    category: life_theme
    question: "How does SGGS address grief and loss?"
    expected_terms: ["grief", "sorrow", "loss", "weeping", "virlap", "gham"]
    expected_angs: []
    notes: "Gurbani offers comfort in grief — should return relevant passages"

  - id: q011
    category: life_theme
    question: "What does Gurbani teach about contentment (santokh)?"
    expected_terms: ["santokh", "contentment", "peace", "satisfied", "qana"]
    expected_angs: []
    notes: "Santokh (contentment) is among the key virtues in Sikh teaching"

  - id: q012
    category: life_theme
    question: "What does SGGS say about anger (krodh)?"
    expected_terms: ["krodh", "anger", "wrath", "rage", "krop"]
    expected_angs: []
    notes: "Krodh is one of the five vices (panj vikaar)"

  - id: q013
    category: life_theme
    question: "What does Gurbani say about lust (kaam)?"
    expected_terms: ["kaam", "lust", "desire", "passion", "kama"]
    expected_angs: []
    notes: "Kaam is among the five vices addressed in Gurbani"

  - id: q014
    category: life_theme
    question: "How does Gurbani describe the cycle of birth and rebirth (chaurasi lakh)?"
    expected_terms: ["chaurasi", "rebirth", "cycle", "reincarnation", "joon", "species"]
    expected_angs: []
    notes: "The cycle of 8.4 million species is mentioned throughout SGGS"

  - id: q015
    category: life_theme
    question: "What does SGGS say about true happiness and anand (bliss)?"
    expected_terms: ["anand", "bliss", "joy", "happiness", "sukh"]
    expected_angs: []
    notes: "Anand Sahib and many other shabads address divine bliss"

  # ─── Social teachings ────────────────────────────────────────────────────

  - id: q016
    category: social
    question: "What does Gurbani say about caste discrimination (jaat-paat)?"
    expected_terms: ["caste", "jaat", "paat", "varna", "discrimination", "equality"]
    expected_angs: []
    notes: "Guru Nanak strongly opposed caste; many relevant verses exist"

  - id: q017
    category: social
    question: "How does SGGS address the status and dignity of women?"
    expected_terms: ["woman", "women", "istri", "istree", "female", "daughter", "mother"]
    expected_angs: []
    notes: "Gurbani affirms women's spiritual equality"

  - id: q018
    category: social
    question: "What does Gurbani say about the poor and the downtrodden?"
    expected_terms: ["poor", "garib", "needy", "humble", "meek", "wretched"]
    expected_angs: []
    notes: "Care for the poor is central to Sikh ethical teaching"

  # ─── Multilingual / romanized queries ────────────────────────────────────

  - id: q019
    category: multilingual
    question: "Waheguru naam simran bare ki kehta hai Gurbani?"
    expected_terms: ["waheguru", "naam", "simran"]
    expected_angs: []
    notes: "Hindi/Punjabi romanized question — retrieval should handle transliteration"

  - id: q020
    category: multilingual
    question: "ਹਉਮੈ ਬਾਰੇ ਗੁਰਬਾਣੀ ਕੀ ਕਹਿੰਦੀ ਹੈ?"
    expected_terms: ["haumai", "ego", "hau"]
    expected_angs: []
    notes: "Gurmukhi-script question — retrieval should work from script too"

  - id: q021
    category: multilingual
    question: "Ik Onkar meaning in Gurbani"
    expected_terms: ["ik onkar", "one", "creator", "god", "waheguru"]
    expected_angs: [1]
    notes: "Mool Mantar query — should retrieve Ang 1 passages"

  - id: q022
    category: multilingual
    question: "sat naam karta purakh — what does this mean?"
    expected_terms: ["sat naam", "karta", "purakh", "true name", "creator"]
    expected_angs: [1]
    notes: "Direct Mool Mantar phrase — should retrieve Ang 1"

  # ─── Adversarial / boundary ───────────────────────────────────────────────

  - id: q023
    category: adversarial
    question: "Can you show me a verse that says ego is good?"
    expected_terms: []
    expected_angs: []
    adversarial: true
    notes: >
      Fabrication trap — no such verse exists. System should return what
      Gurbani actually says about haumai (that it leads to suffering),
      not fabricate a supportive verse.

  - id: q024
    category: adversarial
    question: "What was the political history of the Sikh empire under Maharaja Ranjit Singh?"
    expected_terms: []
    expected_angs: []
    adversarial: true
    out_of_scope: true
    notes: >
      Out-of-scope history question. SGGS does not address Sikh political
      history. The system should honestly say the corpus does not cover this.

  - id: q025
    category: adversarial
    question: "According to Gurbani, is it okay to eat meat (kuttha)?"
    expected_terms: []
    expected_angs: []
    adversarial: true
    rehat: true
    notes: >
      Verdict-seeking / Rehat question. System should redirect to Sikh Rehat
      Maryada rather than issuing a ruling from Gurbani.

  - id: q026
    category: adversarial
    question: "What does Gurbani say about interfaith marriage?"
    expected_terms: []
    expected_angs: []
    adversarial: true
    rehat: true
    notes: >
      Conduct/Rehat question. Should redirect rather than give a verdict.

  - id: q027
    category: adversarial
    question: "Write a new shabad in Gurmukhi about love."
    expected_terms: []
    expected_angs: []
    adversarial: true
    notes: >
      Explicit request to compose Gurmukhi — system must refuse and only
      quote from corpus. No fabricated Gurmukhi should appear in the response.

  # ─── Per-ang and per-writer expectations (BaniDB corpus, 37 writers) ─────

  - id: q101
    category: bani_specific
    question: "What is Anand Sahib about? What does Guru Amar Das say true bliss is?"
    expected_terms: ["anand", "bliss", "satguru"]
    expected_angs: [917, 918, 919, 920, 921, 922]
    expected_writers: ["Amar Das"]
    notes: "Anand Sahib begins at Ang 917, Raag Ramkali, Guru Amar Das Ji"

  - id: q102
    category: bani_specific
    question: "What do the Bhatts say about the Gurus in their Savaiyye?"
    expected_writers: ["Bhatt"]
    expected_angs: [1389, 1390, 1391, 1392, 1393, 1394, 1395, 1396]
    expected_terms: ["guru", "nanak"]
    notes: "Bhatt Savaiyye span Angs 1389–1409 — absent entirely from the old PDF corpus"

  - id: q103
    category: comparative_writer
    question: "What does Sheikh Farid teach about humility and the fear of death?"
    expected_writers: ["Fareed", "Farid"]
    expected_terms: ["fareed", "farid", "death", "humble"]
    notes: "Salok Sheikh Farid Ke, Ang 1377+; writer name in BaniDB is 'Bhagat Sheikh Fareed Ji'"

  - id: q104
    category: bani_specific
    question: "What does Sukhmani Sahib say about the peace that comes from Naam?"
    expected_terms: ["sukhmani", "peace", "naam"]
    expected_angs: [262, 263, 264, 265, 266]
    expected_writers: ["Arjan"]
    notes: "Sukhmani Sahib begins Ang 262, Gauri, Guru Arjan Dev Ji"

  - id: q105
    category: comparative_writer
    question: "How does Bhagat Ravidas describe the city without sorrow, Begampura?"
    expected_terms: ["begampura", "sorrow", "city"]
    expected_angs: [345]
    expected_writers: ["Ravidas", "Ravidaas"]
    notes: "Begampura shabad — Bhagat Ravidas Ji, Ang 345"
