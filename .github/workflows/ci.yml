name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Lightweight install: the unit suite deliberately excludes the two
      # test files that need torch/chromadb (test_retrieve needs a built
      # index; test_rag needs a live LLM key).
      - name: Install test dependencies
        run: |
          pip install pytest pydantic requests python-dotenv anthropic \
                      fastapi httpx pyyaml

      - name: Unit tests
        run: |
          python -m pytest tests/ -q \
            --ignore=tests/test_retrieve.py \
            --ignore=tests/test_rag.py

      - name: Corpus accuracy audit
        run: python -m src.audit
